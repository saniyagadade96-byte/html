<html>
<head>
  <title> CSS Filter Example</title>
  
  <style>
      img {
	      width:300px;
		  filter:grayscale(100%);
		  transition:0.5s;
		  }
		  
		 img:hover {
             filter:grayscale(0%) brightness(120%);
     	}
  </style>
</head>

<body>
 
   <h2> CSS Filter Property </h2>
 
  <img src="butterfly.22.png" alt="butterfly.22">

</body>
</html>  
			 
</html>
